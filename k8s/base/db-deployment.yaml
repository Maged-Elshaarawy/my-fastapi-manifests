apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_USER
              value: items_user
            - name: POSTGRES_PASSWORD
              value: items_password
            - name: POSTGRES_DB
              value: mydb
          ports:
            - containerPort: 5432
