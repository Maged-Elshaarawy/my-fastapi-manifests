apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: magedelshaarawy/project-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://items_user:items_password@db:5432/mydb    
